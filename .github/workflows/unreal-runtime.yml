      - "docs/unreal/**"
      - "docs/contracts/**"
      - "src/main/java/com/gahyeonbot/adapters/unreal/**"
      - "src/test/java/com/gahyeonbot/adapters/unreal/**"
      - "scripts/test_unreal_runtime_core.sh"
      - "scripts/verify_unreal_stage_scaffold.sh"
      - "scripts/verify_unreal_protocol_contract.sh"
      - "scripts/run_unreal_engine_gate.sh"
      - "scripts/run_unreal_engine_gate.ps1"
      - "scripts/test_run_unreal_engine_gate.sh"
      - "scripts/test_run_unreal_engine_windows_gate.py"
      - "scripts/verify_unreal_engine_evidence.py"
      - "scripts/test_verify_unreal_engine_evidence.py"
      - "scripts/build_desktop_realtime_acceptance.py"
      - "scripts/verify_desktop_realtime_acceptance.py"
      - "scripts/test_build_desktop_realtime_acceptance.py"
      - "scripts/run_desktop_realtime_acceptance.ps1"
      - "scripts/test_run_desktop_realtime_acceptance.py"
      - "scripts/verify_looking_glass_integration.py"
      - "scripts/test_verify_looking_glass_integration.py"
      - "scripts/install_looking_glass_unreal_plugin.py"
      - "scripts/test_install_looking_glass_unreal_plugin.py"
      - "scripts/verify_looking_glass_acceptance.py"
      - "scripts/test_verify_looking_glass_acceptance.py"
      - "scripts/build_looking_glass_acceptance.py"
      - "scripts/test_build_looking_glass_acceptance.py"
      - "scripts/merge_looking_glass_benchmark_fragments.py"
      - "scripts/test_merge_looking_glass_benchmark_fragments.py"
      - "scripts/verify_looking_glass_unreal_profile.py"
      - "scripts/test_verify_looking_glass_unreal_profile.py"
      - "scripts/verify_looking_glass_adapter_source.py"
      - "scripts/test_verify_looking_glass_adapter_source.py"
      - "scripts/looking_glass_runtime_attestation.py"
      - "scripts/looking_glass_contract_fixture.py"
      - "scripts/run_looking_glass_windows_gate.ps1"
      - "scripts/verify_gahyeon_hero_asset.py"
      - "scripts/test_verify_gahyeon_hero_asset.py"
      - "scripts/package_gahyeon_unreal_content.py"
      - "scripts/test_package_gahyeon_unreal_content.py"
      - "scripts/install_gahyeon_unreal_content.py"
      - "scripts/test_install_gahyeon_unreal_content.py"
      - "scripts/verify_streaming_stt_contract.py"
      - "scripts/test_verify_streaming_stt_contract.py"
      - "scripts/requirements-contracts.txt"
      - ".github/workflows/unreal-runtime.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "unreal/**"
      - "docs/unreal/**"
      - "docs/contracts/**"
      - "src/main/java/com/gahyeonbot/adapters/unreal/**"
      - "src/test/java/com/gahyeonbot/adapters/unreal/**"
      - "scripts/test_unreal_runtime_core.sh"
      - "scripts/verify_unreal_stage_scaffold.sh"
      - "scripts/verify_unreal_protocol_contract.sh"
      - "scripts/run_unreal_engine_gate.sh"
      - "scripts/run_unreal_engine_gate.ps1"
      - "scripts/test_run_unreal_engine_gate.sh"
      - "scripts/test_run_unreal_engine_windows_gate.py"
      - "scripts/verify_unreal_engine_evidence.py"
      - "scripts/test_verify_unreal_engine_evidence.py"
      - "scripts/build_desktop_realtime_acceptance.py"
      - "scripts/verify_desktop_realtime_acceptance.py"
      - "scripts/test_build_desktop_realtime_acceptance.py"
      - "scripts/run_desktop_realtime_acceptance.ps1"
      - "scripts/test_run_desktop_realtime_acceptance.py"
      - "scripts/verify_looking_glass_integration.py"
      - "scripts/test_verify_looking_glass_integration.py"
      - "scripts/install_looking_glass_unreal_plugin.py"
      - "scripts/test_install_looking_glass_unreal_plugin.py"
      - "scripts/verify_looking_glass_acceptance.py"
      - "scripts/test_verify_looking_glass_acceptance.py"
      - "scripts/build_looking_glass_acceptance.py"
      - "scripts/test_build_looking_glass_acceptance.py"
      - "scripts/merge_looking_glass_benchmark_fragments.py"
      - "scripts/test_merge_looking_glass_benchmark_fragments.py"
      - "scripts/verify_looking_glass_unreal_profile.py"
      - "scripts/test_verify_looking_glass_unreal_profile.py"
      - "scripts/verify_looking_glass_adapter_source.py"
      - "scripts/test_verify_looking_glass_adapter_source.py"
      - "scripts/looking_glass_runtime_attestation.py"
      - "scripts/looking_glass_contract_fixture.py"
      - "scripts/run_looking_glass_windows_gate.ps1"
      - "scripts/verify_gahyeon_hero_asset.py"
      - "scripts/test_verify_gahyeon_hero_asset.py"
      - "scripts/package_gahyeon_unreal_content.py"
      - "scripts/test_package_gahyeon_unreal_content.py"
      - "scripts/install_gahyeon_unreal_content.py"
      - "scripts/test_install_gahyeon_unreal_content.py"
      - "scripts/verify_streaming_stt_contract.py"
      - "scripts/test_verify_streaming_stt_contract.py"
      - "scripts/requirements-contracts.txt"
      - ".github/workflows/unreal-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-contracts.txt

      - name: Install contract validator dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-contracts.txt

      - name: Validate UE 5.6 source scaffold
        run: |
          ./scripts/verify_unreal_stage_scaffold.sh
          bash -n ./scripts/run_unreal_engine_gate.sh
          ./scripts/test_run_unreal_engine_gate.sh
          python3 ./scripts/test_run_unreal_engine_windows_gate.py
          python3 ./scripts/test_verify_unreal_engine_evidence.py
          python3 ./scripts/test_build_desktop_realtime_acceptance.py
          python3 ./scripts/test_run_desktop_realtime_acceptance.py
          python3 ./scripts/test_verify_looking_glass_integration.py
          python3 ./scripts/verify_looking_glass_integration.py
          python3 ./scripts/test_install_looking_glass_unreal_plugin.py
          python3 ./scripts/test_verify_looking_glass_acceptance.py
          python3 ./scripts/test_build_looking_glass_acceptance.py
          python3 ./scripts/test_merge_looking_glass_benchmark_fragments.py
          python3 ./scripts/test_verify_looking_glass_unreal_profile.py
          python3 ./scripts/verify_looking_glass_unreal_profile.py
          python3 ./scripts/test_verify_looking_glass_adapter_source.py
          python3 ./scripts/verify_looking_glass_adapter_source.py
          python3 ./scripts/test_verify_gahyeon_hero_asset.py
          python3 ./scripts/test_package_gahyeon_unreal_content.py
          python3 ./scripts/test_install_gahyeon_unreal_content.py
          python3 ./scripts/test_verify_streaming_stt_contract.py
          python3 ./scripts/verify_streaming_stt_contract.py

      - name: Build and test engine-neutral RuntimeCore
        run: ./scripts/test_unreal_runtime_core.sh

      - name: Validate canonical protocol fixtures
        run: ./scripts/verify_unreal_protocol_contract.sh

  backend-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test Unreal backend adapter
        run: ./gradlew test --tests 'com.gahyeonbot.adapters.unreal.*'
