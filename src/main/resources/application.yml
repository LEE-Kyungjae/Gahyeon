#apllication.yml
app:
  credentials:
    # Adapter/provider credentials are optional at Core boot. Each enabled
    # adapter validates only the credentials it actually consumes.
    application-id: ${APPLICATION_ID:}
    token: ${TOKEN:}
    spotify-client-id: ${SPOTIFY_CLIENT_ID:}
    spotify-client-secret: ${SPOTIFY_CLIENT_SECRET:}
    openai-api-key: ${OPENAI_API_KEY:}
    glm-api-key: ${GLM_API_KEY:}
    glm-model: ${GLM_MODEL:glm-4.7-flash}
    glm-connect-timeout-ms: ${GLM_CONNECT_TIMEOUT_MS:5000}
    glm-read-timeout-ms: ${GLM_READ_TIMEOUT_MS:20000}

weather:
  prefetch:
    enabled: ${WEATHER_PREFETCH_ENABLED:${BOT_ENABLED:true}}

spring:
  ai:
    model:
      chat: ${GAHYEON_AGENT_PROVIDER:none}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
    openai:
      chat:
        options:
          model: ${AGENT_MODEL:${OPENROUTER_MODEL:openrouter/free}}
          temperature: 0.7
          max-tokens: 500     # 응답 길이 제한으로 비용 절감
      api-key: ${AGENT_API_KEY:${OPENROUTER_API_KEY:${OPEN_ROUTER:${OPENAI_API_KEY:}}}}
      base-url: ${AGENT_BASE_URL:${OPENROUTER_BASE_URL:https://openrouter.ai/api}}
  application:
    name: gahyeon
  profiles:
    default: dev  # 기본 실행 시 dev 프로필 사용 (운영과 동일한 환경)
  main:
    web-application-type: servlet  # 명시적으로 웹 서버 활성화
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  servlet:
    context-path: /api
  shutdown: graceful

gahyeon:
  memory:
    compaction:
      # Provider calls never run on the conversation/TTS path. A single bounded
      # worker also protects the summarization provider from burst traffic.
      queue-capacity: ${GAHYEON_MEMORY_COMPACTION_QUEUE_CAPACITY:32}
      batch-size: ${GAHYEON_MEMORY_COMPACTION_BATCH_SIZE:4}
  content-safety:
    provider: ${GAHYEON_CONTENT_SAFETY_PROVIDER:openai}
    connect-timeout-millis: ${GAHYEON_CONTENT_SAFETY_CONNECT_TIMEOUT_MILLIS:300}
    read-timeout-millis: ${GAHYEON_CONTENT_SAFETY_READ_TIMEOUT_MILLIS:700}
    failure-cooldown-millis: ${GAHYEON_CONTENT_SAFETY_FAILURE_COOLDOWN_MILLIS:30000}
  agent:
    provider-failure-cooldown-millis: ${GAHYEON_AGENT_PROVIDER_FAILURE_COOLDOWN_MILLIS:5000}
    streaming:
      # Enable only after the selected OpenAI-compatible provider/model is verified to never
      # mix tool calls and speakable content in the same streamed assistant step.
      tool-text-exclusive-enabled: ${GAHYEON_AGENT_TOOL_SAFE_STREAMING_ENABLED:false}
      verified-base-url: ${GAHYEON_AGENT_STREAMING_VERIFIED_BASE_URL:}
      verified-model: ${GAHYEON_AGENT_STREAMING_VERIFIED_MODEL:}
  headless:
    enabled: ${GAHYEON_HEADLESS_ENABLED:false}
  client-auth:
    # Without a token, Gahyeon client APIs accept loopback traffic only.
    token: ${GAHYEON_CLIENT_TOKEN:}
  desktop:
    event-poll-millis: ${GAHYEON_DESKTOP_EVENT_POLL_MILLIS:250}
    maximum-event-subscriptions: ${GAHYEON_DESKTOP_MAXIMUM_EVENT_SUBSCRIPTIONS:128}
    maximum-event-subscriptions-per-session: ${GAHYEON_DESKTOP_MAXIMUM_EVENT_SUBSCRIPTIONS_PER_SESSION:4}
  identity-link:
    cleanup-millis: ${GAHYEON_IDENTITY_LINK_CLEANUP_MILLIS:3600000}
  speech:
    expression-planner:
      small-model:
        enabled: ${GAHYEON_EXPRESSION_SMALL_MODEL_ENABLED:false}
        endpoint: ${GAHYEON_EXPRESSION_SMALL_MODEL_ENDPOINT:}
        api-key: ${GAHYEON_EXPRESSION_SMALL_MODEL_API_KEY:}
        model-id: ${GAHYEON_EXPRESSION_SMALL_MODEL_ID:Qwen/Qwen3-0.6B}
        timeout-millis: ${GAHYEON_EXPRESSION_SMALL_MODEL_TIMEOUT_MILLIS:180}
        max-response-bytes: ${GAHYEON_EXPRESSION_SMALL_MODEL_MAX_RESPONSE_BYTES:4096}
    expressive:
      qwen:
        enabled: ${GAHYEON_QWEN_EXPRESSIVE_TTS_ENABLED:false}
        endpoint: ${GAHYEON_QWEN_EXPRESSIVE_TTS_ENDPOINT:}
        api-key: ${GAHYEON_QWEN_EXPRESSIVE_TTS_API_KEY:}
        model-id: ${GAHYEON_QWEN_EXPRESSIVE_TTS_MODEL_ID:}
        quantization: ${GAHYEON_QWEN_EXPRESSIVE_TTS_QUANTIZATION:}
        timeout-millis: ${GAHYEON_QWEN_EXPRESSIVE_TTS_TIMEOUT_MILLIS:30000}
        max-audio-bytes: ${GAHYEON_QWEN_EXPRESSIVE_TTS_MAX_AUDIO_BYTES:16777216}
  unreal:
    runtime:
      # Bounded pools keep slow cognition/TTS work away from the WebSocket and Game threads.
      cognition-core-threads: ${GAHYEON_UNREAL_COGNITION_CORE_THREADS:1}
      cognition-max-threads: ${GAHYEON_UNREAL_COGNITION_MAX_THREADS:2}
      cognition-queue-capacity: ${GAHYEON_UNREAL_COGNITION_QUEUE_CAPACITY:0}
      tts-threads: ${GAHYEON_UNREAL_TTS_THREADS:1}
      tts-queue-capacity: ${GAHYEON_UNREAL_TTS_QUEUE_CAPACITY:8}
      # Each renderer drains in order on its own bounded queue. A slow light-field
      # display must not delay Desktop speech or the TTS worker.
      outbound-threads: ${GAHYEON_UNREAL_OUTBOUND_THREADS:4}
      outbound-executor-queue-capacity: ${GAHYEON_UNREAL_OUTBOUND_EXECUTOR_QUEUE_CAPACITY:32}
      outbound-per-renderer-queue-capacity: ${GAHYEON_UNREAL_OUTBOUND_PER_RENDERER_QUEUE_CAPACITY:64}
      maximum-renderer-connections: ${GAHYEON_UNREAL_MAXIMUM_RENDERER_CONNECTIONS:64}
      maximum-renderer-connections-per-session: ${GAHYEON_UNREAL_MAXIMUM_RENDERER_CONNECTIONS_PER_SESSION:4}
      renderer-hello-timeout-seconds: ${GAHYEON_UNREAL_RENDERER_HELLO_TIMEOUT_SECONDS:10}
      renderer-heartbeat-timeout-seconds: ${GAHYEON_UNREAL_RENDERER_HEARTBEAT_TIMEOUT_SECONDS:30}
      speech-segment-max-characters: ${GAHYEON_UNREAL_SPEECH_SEGMENT_MAX_CHARACTERS:120}
    websocket:
      # Requires headless.enabled as well. Keep disabled until an Unreal client is ready.
      enabled: ${GAHYEON_UNREAL_WEBSOCKET_ENABLED:false}
      poll-millis: ${GAHYEON_UNREAL_WEBSOCKET_POLL_MILLIS:100}
    streaming-stt:
      # A provider bean is also required. When absent, this endpoint is not registered and
      # the existing batch-WAV path remains available for the next utterance.
      enabled: ${GAHYEON_UNREAL_STREAMING_STT_ENABLED:false}
      initial-start-seconds: ${GAHYEON_UNREAL_STREAMING_STT_INITIAL_START_SECONDS:10}
      # Hard start-to-terminal deadline. It also reclaims a client that starts capture and
      # disappears without sending end/cancel while leaving the WebSocket half-open.
      maximum-stream-seconds: ${GAHYEON_UNREAL_STREAMING_STT_MAXIMUM_STREAM_SECONDS:120}
      maximum-connections: ${GAHYEON_UNREAL_STREAMING_STT_MAXIMUM_CONNECTIONS:32}
      outbound-threads: ${GAHYEON_UNREAL_STREAMING_STT_OUTBOUND_THREADS:4}
      outbound-executor-queue-capacity: ${GAHYEON_UNREAL_STREAMING_STT_OUTBOUND_EXECUTOR_QUEUE_CAPACITY:32}
      outbound-per-connection-queue-capacity: ${GAHYEON_UNREAL_STREAMING_STT_OUTBOUND_PER_CONNECTION_QUEUE_CAPACITY:64}
    viseme:
      enabled: ${GAHYEON_UNREAL_VISEME_ALIGNER_ENABLED:false}
      endpoint: ${GAHYEON_UNREAL_VISEME_ALIGNER_ENDPOINT:}
      api-key: ${GAHYEON_UNREAL_VISEME_ALIGNER_API_KEY:}
      timeout-millis: ${GAHYEON_UNREAL_VISEME_ALIGNER_TIMEOUT_MILLIS:1500}
      playback-deadline-millis: ${GAHYEON_UNREAL_VISEME_ALIGNER_PLAYBACK_DEADLINE_MILLIS:250}
      threads: ${GAHYEON_UNREAL_VISEME_ALIGNER_THREADS:2}
      queue-capacity: ${GAHYEON_UNREAL_VISEME_ALIGNER_QUEUE_CAPACITY:8}
      max-audio-bytes: ${GAHYEON_UNREAL_VISEME_ALIGNER_MAX_AUDIO_BYTES:2000000}
      max-response-bytes: ${GAHYEON_UNREAL_VISEME_ALIGNER_MAX_RESPONSE_BYTES:131072}
    perception-cleanup-millis: ${GAHYEON_UNREAL_PERCEPTION_CLEANUP_MILLIS:5000}
    audio-cleanup-millis: ${GAHYEON_UNREAL_AUDIO_CLEANUP_MILLIS:30000}
  behavior:
    enabled: ${GAHYEON_BEHAVIOR_ENABLED:false}
    tick-millis: ${GAHYEON_BEHAVIOR_TICK_MILLIS:10000}
  life:
    enabled: ${GAHYEON_LIFE_ENABLED:false}
    tick-millis: ${GAHYEON_LIFE_TICK_MILLIS:60000}
  characters:
    primary-id: gahyeon
    catalog:
      - id: gahyeon
        display-name: 가현
        persona-prompt: prompts/characters/gahyeon.txt
        voice-profile: gahyeon.assistant
        expression-profile: gahyeon.metahuman
        autonomous-enabled: true
        initiative-threshold: 0.65
        initiative-cooldown: 12m
        social-drift-per-hour: 0.055
        curiosity-drift-per-hour: 0.040
        rest-drift-per-hour: 0.030
      - id: diana
        display-name: 다이애나
        persona-prompt: prompts/characters/diana.txt
        voice-profile: diana.assistant
        expression-profile: diana.metahuman
        autonomous-enabled: false
        initiative-threshold: 0.80
        initiative-cooldown: 18m
        social-drift-per-hour: 0.040
        curiosity-drift-per-hour: 0.060
        rest-drift-per-hour: 0.025
      - id: stella-lily
        display-name: 스텔라 릴리
        persona-prompt: prompts/characters/stella-lily.txt
        voice-profile: gahyeon.assistant
        expression-profile: stella-lily.unreal
        autonomous-enabled: false
        initiative-threshold: 0.78
        initiative-cooldown: 16m
        social-drift-per-hour: 0.045
        curiosity-drift-per-hour: 0.055
        rest-drift-per-hour: 0.030
      - id: ururu
        display-name: 우루루
        persona-prompt: prompts/characters/ururu.txt
        voice-profile: gahyeon.assistant
        expression-profile: ururu.unreal
        autonomous-enabled: false
        initiative-threshold: 0.76
        initiative-cooldown: 15m
        social-drift-per-hour: 0.050
        curiosity-drift-per-hour: 0.050
        rest-drift-per-hour: 0.032
  world-action:
    execution-tick-millis: ${GAHYEON_WORLD_ACTION_EXECUTION_TICK_MILLIS:250}
    timeout-scan-millis: ${GAHYEON_WORLD_ACTION_TIMEOUT_SCAN_MILLIS:5000}

bot:
  enabled: ${BOT_ENABLED:true}
  leader-lock:
    enabled: ${BOT_LEADER_LOCK_ENABLED:true}
    key: ${BOT_LEADER_LOCK_KEY:1220338955082399845}
    retry-ms: ${BOT_LEADER_LOCK_RETRY_MS:30000}

# 공통 로깅 패턴
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 공통
management:
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

paper-rag:
  enabled: ${PAPER_RAG_ENABLED:false}
  base-url: ${PAPER_RAG_BASE_URL:http://127.0.0.1:8765}
  api-key: ${PAPER_RAG_API_KEY:}
  top-k: ${PAPER_RAG_TOP_K:5}
  min-score: ${PAPER_RAG_MIN_SCORE:0.35}
  connect-timeout-ms: ${PAPER_RAG_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${PAPER_RAG_READ_TIMEOUT_MS:20000}

tts:
  enabled: ${TTS_ENABLED:true}
  provider: ${TTS_PROVIDER:voicebox}
  fallback-to-edge: ${TTS_FALLBACK_TO_EDGE:true}
  max-chars: ${TTS_MAX_CHARS:400}
  segment-max-chars: ${TTS_SEGMENT_MAX_CHARS:120}
  timeout-seconds: ${TTS_TIMEOUT_SECONDS:20}
  edge:
    bin: ${TTS_EDGE_BIN:edge-tts}
    endpoint: ${TTS_EDGE_ENDPOINT:}
    voice: ${TTS_EDGE_VOICE:ko-KR-SunHiNeural}
    rate: ${TTS_EDGE_RATE:+0%}
    pitch: ${TTS_EDGE_PITCH:+0Hz}
  custom:
    endpoint: ${CUSTOM_TTS_ENDPOINT:}
    api-key: ${CUSTOM_TTS_API_KEY:}
    model: ${CUSTOM_TTS_MODEL:}
    model-sha256: ${CUSTOM_TTS_MODEL_SHA256:}
    config-sha256: ${CUSTOM_TTS_CONFIG_SHA256:}
    speaker-id: ${CUSTOM_TTS_SPEAKER_ID:}
    format: ${CUSTOM_TTS_FORMAT:wav}
    timeout-seconds: ${CUSTOM_TTS_TIMEOUT_SECONDS:60}
  voicebox:
    base-url: ${VOICEBOX_BASE_URL:http://127.0.0.1:17493}
    profile-id: ${VOICEBOX_PROFILE_ID:1df376d5-c74d-415c-a2f0-fdb1654f7331}
    profile-name: ${VOICEBOX_PROFILE_NAME:내 목소리 (녹음 9)}
    language: ${VOICEBOX_LANGUAGE:ko}
    engine: ${VOICEBOX_ENGINE:qwen}
    model-size: ${VOICEBOX_MODEL_SIZE:0.6B}
    normalize: ${VOICEBOX_NORMALIZE:true}
    timeout-seconds: ${VOICEBOX_TIMEOUT_SECONDS:300}
    poll-millis: ${VOICEBOX_POLL_MILLIS:500}
  kss:
    python: ${TTS_PYTHON:python3}
    script: ${TTS_KSS_SCRIPT:/app/tts_split.py}

assistant:
  enabled: ${ASSISTANT_ENABLED:false}
  max-utterance-seconds: ${ASSISTANT_MAX_UTTERANCE_SECONDS:20}
  silence-millis: ${ASSISTANT_SILENCE_MILLIS:900}
  speak-responses: ${ASSISTANT_SPEAK_RESPONSES:true}
  tts-provider: ${ASSISTANT_TTS_PROVIDER:edge}
  response-acknowledgement-millis: ${ASSISTANT_RESPONSE_ACKNOWLEDGEMENT_MILLIS:1500}
  # The singular value is a backwards-compatible override. Leave it empty to rotate the list.
  response-acknowledgement-text: ${ASSISTANT_RESPONSE_ACKNOWLEDGEMENT_TEXT:}
  response-acknowledgement-texts: ${ASSISTANT_RESPONSE_ACKNOWLEDGEMENT_TEXTS:잠깐만요. 정리해서 답할게요.,알아보고 있어요. 조금만 기다려 주세요.,확인 중이에요. 곧 말씀드릴게요.,생각을 정리하고 있어요. 잠시만요.}
  response-acknowledgement-cooldown-millis: ${ASSISTANT_RESPONSE_ACKNOWLEDGEMENT_COOLDOWN_MILLIS:30000}
  max-ai-requests-per-minute: ${ASSISTANT_MAX_AI_REQUESTS_PER_MINUTE:12}
  duplicate-transcript-millis: ${ASSISTANT_DUPLICATE_TRANSCRIPT_MILLIS:10000}
  vad:
    enabled: ${ASSISTANT_VAD_ENABLED:true}
    hop-size: ${ASSISTANT_VAD_HOP_SIZE:256}
    threshold: ${ASSISTANT_VAD_THRESHOLD:0.3}
    min-speech-millis: ${ASSISTANT_VAD_MIN_SPEECH_MILLIS:300}
    transcription-silence-millis: ${ASSISTANT_VAD_TRANSCRIPTION_SILENCE_MILLIS:700}
    end-silence-millis: ${ASSISTANT_VAD_END_SILENCE_MILLIS:1500}
    pre-roll-millis: ${ASSISTANT_VAD_PRE_ROLL_MILLIS:500}
  stt:
    enabled: ${ASSISTANT_STT_ENABLED:false}
    base-url: ${ASSISTANT_STT_BASE_URL:https://api.openai.com/v1}
    endpoint: ${ASSISTANT_STT_ENDPOINT:/audio/transcriptions}
    api-key: ${ASSISTANT_STT_API_KEY:}
    model: ${ASSISTANT_STT_MODEL:gpt-4o-mini-transcribe}
    language: ${ASSISTANT_STT_LANGUAGE:ko}
    prompt: ${ASSISTANT_STT_PROMPT:GitHub, 깃허브, 레포, 레포지토리, Gahyeon, 가현, 가현봇, 에이전트, OpenRouter, 큐드란트, Qdrant, Piper, Voicebox, Whisper}
    timeout-seconds: ${ASSISTANT_STT_TIMEOUT_SECONDS:8}
    api-key-required: ${ASSISTANT_STT_API_KEY_REQUIRED:true}
    realtime:
      enabled: ${ASSISTANT_STT_REALTIME_ENABLED:false}
      url: ${ASSISTANT_STT_REALTIME_URL:wss://api.openai.com/v1/realtime?model=gpt-live-transcribe}
      model: ${ASSISTANT_STT_REALTIME_MODEL:gpt-live-transcribe}
      delay: ${ASSISTANT_STT_REALTIME_DELAY:low}
      target-sample-rate: ${ASSISTANT_STT_REALTIME_TARGET_SAMPLE_RATE:24000}
      maximum-pending-sends: ${ASSISTANT_STT_REALTIME_MAXIMUM_PENDING_SENDS:16}
      final-timeout-seconds: ${ASSISTANT_STT_REALTIME_FINAL_TIMEOUT_SECONDS:10}
  openrouter:
    enabled: ${ASSISTANT_OPENROUTER_ENABLED:false}
    api-key: ${OPENROUTER_API_KEY:${OPEN_ROUTER:}}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:openrouter/free}
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:60}

notifications:
  dm:
    enabled: ${NOTIFICATIONS_DM_ENABLED:true}
    max-retries: ${NOTIFICATIONS_DM_MAX_RETRIES:3}
    trending-enabled: ${NOTIFICATIONS_DM_TRENDING_ENABLED:true}
    trending-cron: ${NOTIFICATIONS_DM_TRENDING_CRON:0 0 7 * * *}
    schedule-zone: ${NOTIFICATIONS_DM_SCHEDULE_ZONE:Asia/Seoul}
    trending-summary-enabled: ${NOTIFICATIONS_DM_TRENDING_SUMMARY_ENABLED:true}
    trending-summary-cron: ${NOTIFICATIONS_DM_TRENDING_SUMMARY_CRON:0 30 6 * * *}

news:
  personalized:
    enabled: ${PERSONALIZED_NEWS_ENABLED:false}
    poll-millis: ${PERSONALIZED_NEWS_POLL_MILLIS:1800000}
    initial-delay-millis: ${PERSONALIZED_NEWS_INITIAL_DELAY_MILLIS:60000}
    digest-cron: ${PERSONALIZED_NEWS_DIGEST_CRON:0 0 8 * * *}
    schedule-zone: ${PERSONALIZED_NEWS_SCHEDULE_ZONE:Asia/Seoul}
    lookback-hours: ${PERSONALIZED_NEWS_LOOKBACK_HOURS:30}
    maximum-items: ${PERSONALIZED_NEWS_MAXIMUM_ITEMS:5}
    topics: ${PERSONALIZED_NEWS_TOPICS:AI,LLM,에이전트,로봇,GitHub,GPU}
    sources:
      - id: openai-news
        name: OpenAI News
        url: https://openai.com/news/rss.xml
        official: true
        trust-tier: 1
      - id: google-ai
        name: Google AI
        url: https://blog.google/innovation-and-ai/technology/ai/rss/
        official: true
        trust-tier: 1
      - id: github-changelog
        name: GitHub Changelog
        url: https://github.blog/changelog/feed/
        official: true
        trust-tier: 1
      - id: nvidia-blog
        name: NVIDIA Blog
        url: https://blogs.nvidia.com/feed/
        official: true
        trust-tier: 1
